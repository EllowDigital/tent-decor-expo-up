[build]
  command = "DEPLOY_TARGET=netlify npm run build"
  publish = "dist"

[build.environment]
  DEPLOY_TARGET = "netlify"

# Nitro's `netlify` preset emits the SSR Function at
# `.netlify/functions/server`. Static client assets are published from `dist/`.
# The catch-all redirect hands every unmatched request to the SSR function so
# app routes, dynamic routes and XML server routes render server-side.
[functions]
  directory = ".netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
